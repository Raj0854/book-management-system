<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>

    <header>
        <h1>📚 Book Library</h1>
        <p>Books from our Flask REST API</p>
    </header>

    <main>
        <div class="method-buttons">

            <button id="add-book-btn" type="button" data-bs-toggle="modal" data-bs-target="#addNewBook">+ Add
                Book</button>

            <button id="get-book-btn" type="button" data-bs-toggle="modal" data-bs-target="#getBookModal">🔍 Get
                Book</button>

            <button id="update-book-btn" type="button" data-bs-toggle="modal" data-bs-target="#updateBookModal">✏️
                Update Book</button>

            <button id="patch-book-btn" type="button" data-bs-toggle="modal" data-bs-target="#patchBookModal">🔧 Patch
                Book</button>

            <button id="delete-book-btn" type="button" data-bs-toggle="modal" data-bs-target="#deleteBookModal">🗑️
                Delete Book</button>

        </div>

        <div id="books-container"></div>
    </main>


</body>

</html>
<!--add Modal -->
<div class="modal fade" id="addNewBook" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
    aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog  modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="staticBackdropLabel">Add New Book</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">

                <form id="book-form" class="forms_inputs">

                    <input type="text" id="title" placeholder="Book title" required>

                    <input type="text" id="author" placeholder="Author name" required>

                    <input type="number" id="price" placeholder="Price" required>

                    <button type="submit">
                        Add Book
                    </button>

                </form>

                <p id="message"></p>
            </div>

        </div>
    </div>
</div>

<!-- GET BOOK MODAL -->

<div class="modal fade" id="getBookModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
    aria-labelledby="getBookModalLabel" aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h1 class="modal-title fs-5" id="getBookModalLabel">
                    Get Book
                </h1>

                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                </button>

            </div>

            <div class="modal-body">

                <form id="get-book-form" class="forms_inputs">

                    <input type="number" id="get-book-id" placeholder="Enter Book ID" required>

                    <button type="submit" class="btn btn-primary">
                        Get Book
                    </button>

                </form>

                <div id="get-book-result"></div>

            </div>

        </div>

    </div>

</div>
<!-- put  -->
<!-- UPDATE BOOK MODAL -->

<div class="modal fade" id="updateBookModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
    aria-labelledby="updateBookModalLabel" aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h1 class="modal-title fs-5" id="updateBookModalLabel">
                    Update Book
                </h1>

                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                </button>

            </div>

            <div class="modal-body m-3">

                <form id="update-book-form" class="forms_inputs ">

                    <input type="number" id="update-book-id" placeholder="Book ID" class="form-control mb-3" required>

                    <input type="text" id="update-title" placeholder="New title" class="form-control mb-3" required>

                    <input type="text" id="update-author" placeholder="New author" class="form-control mb-3 " required>

                    <input type="number" id="update-price" placeholder="New price" class="form-control mb-3" required>

                    <button type="submit" class="btn btn-warning">
                        Update Book
                    </button>

                </form>

                <p id="update-book-message"></p>

            </div>

        </div>

    </div>

</div>
<script src="script.js"></script>
